[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hive65"
version = "0.3.0"
description = "Open-source driver, Studio app, effects and notifications for the Kreo Hive 65 keyboard"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "hidapi>=0.14",
    "numpy>=1.24",
    "pillow>=10",
    "psutil>=5.9",
]

[project.optional-dependencies]
audio = ["soundcard>=0.4.3"]
input = ["pynput>=1.7; sys_platform != 'linux'", "evdev>=1.6; sys_platform == 'linux'"]
studio = ["pyside6>=6.6", "qtawesome>=1.3"]
notify = [
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
    "screen_brightness_control>=0.23; sys_platform == 'win32'",
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.0; sys_platform == 'win32'",
    "winrt-Windows.UI.Notifications>=2.0; sys_platform == 'win32'",
    "winrt-Windows.UI.Notifications.Management>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Control>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
    "winrt-Windows.ApplicationModel>=2.0; sys_platform == 'win32'",
    "dbus-next>=0.2.3; sys_platform == 'linux'",
]
sysmon = ["nvidia-ml-py>=12"]
screen = ["dxcam>=0.0.5; sys_platform == 'win32'", "mss>=9"]
all = ["hive65[audio,input,studio,notify,screen,sysmon]"]

[project.scripts]
hive65 = "hive65.cli:main"

[project.gui-scripts]
hive65-studio = "hive65.studio.app:main"
hive65-tray = "hive65.studio.app:main"

[tool.setuptools]
packages = ["hive65", "hive65.effects", "hive65.events", "hive65.ambient", "hive65.studio"]

[tool.setuptools.package-data]
hive65 = ["data/*.json"]
